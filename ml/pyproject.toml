[project]
name = "stocklens-ml"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "scipy>=1.14",
    "arch>=7.2",
    "statsmodels>=0.14",
    "mlflow>=3.1,<4",
    "sqlalchemy>=2.0.50,<2.1",
    "psycopg[binary]>=3.3",
    "pydantic-settings>=2.5",
    "joblib>=1.4",
    "structlog>=26",
    # Security floor для транзитивной зависимости (через mlflow): msgpack<1.2.1 уязвим
    # GHSA-6v7p-g79w-8964 (краш процесса при повторном Unpacker после ошибки).
    "msgpack>=1.2.1",
    "stocklens-core",
]

[project.optional-dependencies]
# Зависимости только для ОБУЧЕНИЯ, не для serving-инференса. Вынесены в extra, чтобы образ
# API (зависит от stocklens-ml БЕЗ [train]) их не тянул: serving использует только
# features/data (чистый pandas) + arch (рефит pyfunc). catboost (модель тренда) добавлен
# СЮДА — обучение и оффлайн-метрики (scikit-learn) не текут в образ API. shap НЕ добавляем:
# вклады фич берём нативным catboost get_feature_importance(type="ShapValues"), а shap-пакет
# тянет numba/llvmlite, конфликтующие с Python 3.12 + numpy 2.x.
train = [
    "scikit-learn>=1.5",
    "catboost>=1.2",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-cov>=6",
    "mypy>=2.1",
    "testcontainers[postgres]>=4.14",
]

[tool.uv.sources]
stocklens-core = { path = "../packages/stocklens-core", editable = true }

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "stocklens_ml"
