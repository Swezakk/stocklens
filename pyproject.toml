# Корневой конфиг инструментов качества — общий для всех пакетов и сервисов.
# Зависимости живут в pyproject.toml каждого сервиса (uv), не здесь.

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages", "services", "ml"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "PL",  # pylint
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific
    "N",   # pep8-naming
    "DTZ", # flake8-datetimez — наивные datetime запрещены
    "T20", # flake8-print — print в коде сервисов запрещён (structlog)
]
ignore = [
    "PLR0913", # max-args: DI-провайдеры FastAPI легитимно принимают много зависимостей
    "RUF001",  # «неоднозначный юникод»: документация проекта на русском — кириллица легитимна
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["PLR2004"] # magic numbers допустимы в assert'ах тестов
"ml/notebooks/**" = ["T20"] # print допустим в ноутбуках

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["packages", "services", "tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: тесты с реальными зависимостями (testcontainers)",
]
