# Локальная разработка. Стек наращивается по фазам спеки (§4: 7 сервисов);
# прод-оверрайд для VPS (Dokploy) — docker-compose.prod.yml, появится в фазе деплоя.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Только loopback: для локальных миграций и psql с хоста,
      # наружу PostgreSQL не публикуется.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  migrations:
    build:
      context: .
      dockerfile: services/ingestor/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    # Однократный запуск: завершается после применения миграций.
    restart: "no"

  redis:
    image: redis:7-alpine
    # Чистый кэш без персистентности: LRU-вытеснение не даёт памяти расти
    # неограниченно при множестве ключей свечей (разные тикеры и диапазоны дат).
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mlflow-db-init:
    # Идемпотентно создаёт БД mlflow на сервисе db. НЕ через initdb.d: те скрипты
    # выполняются только при первой инициализации пустого тома, а прод-том уже заполнен
    # (см. docker-compose.prod.yml). $$ экранирует подстановку compose — переменную
    # раскрывает шелл контейнера, не compose.
    image: postgres:16-alpine
    entrypoint: ["sh", "-c"]
    command:
      - >
        psql "$$DATABASE_ADMIN_URL" -tc "SELECT 1 FROM pg_database WHERE datname='mlflow'"
        | grep -q 1 || psql "$$DATABASE_ADMIN_URL" -c "CREATE DATABASE mlflow"
    environment:
      DATABASE_ADMIN_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/postgres
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  mlflow:
    # 7-й сервис (инвариант §4): tracking + реестр моделей. Backend — отдельная БД mlflow на
    # сервисе db; артефакты — том mlflow_artifacts; --serve-artifacts отдаёт их API по models:/.
    build:
      context: .
      dockerfile: services/mlflow/Dockerfile
    command: >
      mlflow server
      --backend-store-uri postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@db:5432/mlflow
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
      --host 0.0.0.0 --port 5000
      --allowed-hosts mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    depends_on:
      db:
        condition: service_healthy
      mlflow-db-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "127.0.0.1:5000:5000"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL_ASYNC: ${DATABASE_URL_ASYNC}
      REDIS_URL: ${REDIS_URL}
      AUTH_MODE: ${AUTH_MODE:-local}
      AUTH_ISSUER: ${AUTH_ISSUER:-https://stocklens.local}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-stocklens-api}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-}
      AUTH_OWNER_USERNAME: ${AUTH_OWNER_USERNAME:-admin}
      AUTH_OWNER_PASSWORD: ${AUTH_OWNER_PASSWORD}
      AUTH_TOKEN_TTL_SECONDS: ${AUTH_TOKEN_TTL_SECONDS:-3600}
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      # api ждёт mlflow healthy → load_bundle грузит модель с первой попытки при полном
      # редеплое, без ручного рестарта (тикет d8f3b2c1). Trade-off: крит-путь зависит от mlflow.
      mlflow:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  ingestor:
    build:
      context: .
      dockerfile: services/ingestor/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TICKERS_UNIVERSE: ${TICKERS_UNIVERSE:-IMOEX}
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      # Heartbeat-файл обновляется сборщиком каждые ~60 с;
      # файл старше 5 минут — признак зависшего процесса.
      test:
        [
          "CMD-SHELL",
          "test -f /tmp/ingestor-heartbeat && find /tmp/ingestor-heartbeat -mmin -5 | grep -q .",
        ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: services/dashboard/Dockerfile
    environment:
      # Дашборд ходит только в API по HTTP (§3); пароль владельца вводится на гейте
      # (= логин в API), секретов в env дашборда нет — только адрес API и имя пользователя.
      API_URL: ${API_URL:-http://api:8000}
      AUTH_OWNER_USERNAME: ${AUTH_OWNER_USERNAME:-admin}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "127.0.0.1:8501:8501"
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: services/bot/Dockerfile
    environment:
      # Бот — потребитель API по HTTP (§3): логинится учётными данными владельца и шлёт
      # дайджесты/команды в Telegram. Токен бота и пароль владельца — секреты из env.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      API_URL: ${API_URL:-http://api:8000}
      AUTH_OWNER_USERNAME: ${AUTH_OWNER_USERNAME:-admin}
      AUTH_OWNER_PASSWORD: ${AUTH_OWNER_PASSWORD}
      # Чат владельца для планового дайджеста 08:30 МСК (B3); алерты идут в chat_id подписки.
      DIGEST_CHAT_ID: ${DIGEST_CHAT_ID}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Heartbeat-файл обновляется ботом каждые ~30 с; файл старше 5 минут — зависший polling.
      test:
        [
          "CMD-SHELL",
          "test -f /tmp/bot-heartbeat && find /tmp/bot-heartbeat -mmin -5 | grep -q .",
        ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  pgdata:
  mlflow_artifacts:
