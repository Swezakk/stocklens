[project]
name = "stocklens-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13,<4",
    "apscheduler>=3.11,<4",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=26",
    "stocklens-core",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6",
    "mypy>=2.1",
    "respx>=0.21",
]

[tool.uv.sources]
stocklens-core = { path = "../../packages/stocklens-core", editable = true }

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "bot"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
