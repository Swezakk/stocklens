[project]
name = "stocklens-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0.50,<2.1",
    "asyncpg>=0.30",
    "redis>=8",
    "pydantic>=2.9",
    "pydantic-settings>=2.14",
    "structlog>=26",
    "stocklens-core",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.4",
    "pytest-cov>=6",
    "mypy>=2.1",
    "httpx>=0.27",
    "asgi-lifespan>=2",
    "respx>=0.22",
    "testcontainers[postgres,redis]>=4.14",
    "alembic>=1.18",
    "psycopg[binary]>=3.3",
]

[tool.uv.sources]
stocklens-core = { path = "../../packages/stocklens-core", editable = true }

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "integration: тесты с реальными зависимостями (testcontainers)",
]

