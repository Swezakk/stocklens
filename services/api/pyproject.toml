[project]
name = "stocklens-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0.50,<2.1",
    "asyncpg>=0.30",
    "redis>=8",
    "pydantic>=2.9",
    "pydantic-settings>=2.14",
    "structlog>=26",
    "stocklens-core",
    "pyportfolioopt>=1.6",
    "numpy>=2.4",
    # mlflow (загрузка ML-моделей, §8.1) ограничивает pandas<3; выравниваем с ml/ (pandas>=2.2).
    "pandas>=2.2,<3",
    "scipy>=1.17",
    # pypfopt → skbase импортирует packaging в runtime, но не объявляет его как
    # hard-зависимость; в dev-окружении он присутствует транзитивно, в prod (--no-dev) — нет.
    "packaging>=24",
    "pyjwt[crypto]>=2.10",
    # OAuth2PasswordRequestForm (эндпоинт /auth/token) парсит form-data — нужен python-multipart.
    "python-multipart>=0.0.18",
    # ML-serving (ml-spec §8): загрузка моделей из реестра (mlflow), рефит GARCH в pyfunc (arch),
    # единый расчёт фич с обучением (stocklens-ml — только features/data, без train-зависимостей).
    "stocklens-ml",
    "arch>=7.2",
    "mlflow>=3.1,<4",
    # Инференс тренда (ml-spec §8.3): нативный CatBoost-артефакт грузится
    # mlflow.catboost.load_model → нужен catboost в рантайме API. Пин <2 — совместимость
    # с артефактом обучения (catboost 1.2.x); sklearn остаётся в ml[train], в образ не течёт.
    "catboost>=1.2,<2",
    # Security floor для транзитивной зависимости (через mlflow): msgpack<1.2.1 уязвим
    # GHSA-6v7p-g79w-8964 (краш процесса при повторном Unpacker после ошибки).
    "msgpack>=1.2.1",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.4",
    "pytest-cov>=6",
    "mypy>=2.1",
    "httpx>=0.27",
    "asgi-lifespan>=2",
    "respx>=0.22",
    "testcontainers[postgres,redis]>=4.14",
    "alembic>=1.18",
    "psycopg[binary]>=3.3",
]

[tool.uv.sources]
stocklens-core = { path = "../../packages/stocklens-core", editable = true }
stocklens-ml = { path = "../../ml", editable = true }

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "api"


[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "integration: тесты с реальными зависимостями (testcontainers)",
]

