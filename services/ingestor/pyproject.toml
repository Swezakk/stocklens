[project]
name = "stocklens-ingestor"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.34",
    "apscheduler>=3.11,<4",
    "tenacity>=9.1",
    "structlog>=26",
    "sqlalchemy>=2.0.50,<2.1",
    "psycopg[binary]>=3.3",
    "alembic>=1.18",
    "stocklens-core",
    "feedparser>=6.0.12",
    "onnxruntime>=1.19",
    "tokenizers>=0.19",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-cov>=6",
    "mypy>=2.1",
    "responses>=0.26",
    "testcontainers[postgres]>=4.14",
    "optimum[onnxruntime]>=1.23",
]

[tool.uv.sources]
stocklens-core = { path = "../../packages/stocklens-core", editable = true }

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "ingestor"

