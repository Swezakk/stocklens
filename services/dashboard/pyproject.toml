[project]
name = "stocklens-dashboard"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # chartCategoricalColors/chartSequentialColors/chartDivergingColors, baseFontSize
    # и colon-URL форма font подтверждены актуальной докой Streamlit; пол версии 1.50.
    "streamlit>=1.50",
    "plotly>=5.24",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.14",
    "pandas>=2.2",
    "stocklens-core",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "mypy>=2.1",
    "respx>=0.22",
    "pytest-cov>=6",
]

[tool.uv.sources]
stocklens-core = { path = "../../packages/stocklens-core", editable = true }

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "dashboard"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
