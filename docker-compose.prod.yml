# Прод-стек для VPS под управлением Dokploy в режиме «Docker Compose» (НЕ «Stack»/Swarm).
#
# Отличия от docker-compose.yml (локальная разработка):
#   - образы НЕ собираются на сервере, а тянутся из GHCR (сборка — в CI,
#     .github/workflows/ci.yml, job `publish`); это снимает риск OOM на 4 ГБ;
#   - том БД — внешний named-volume `stocklens_pgdata` (external): Dokploy не владеет
#     его жизненным циклом, redeploy его не пересоздаёт (защита невосстановимых новостей);
#   - на каждый сервис задан `mem_limit` — один сервис не может OOM-killнуть соседей
#     (включая X-ray на этом же хосте);
#   - БД и API наружу не публикуются: доступ к API настраивается через Traefik/домен
#     в Dokploy (см. docs/deploy.md, фаза E).
#
# Env задаются в Dokploy (env-стор), не в репозитории. Перечень — docs/deploy.md.
services:
  db:
    image: postgres:16-alpine
    # Фиксированное имя — чтобы host-cron бэкапа (scripts/pg_backup.sh) находил контейнер.
    container_name: stocklens-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 768m
    restart: unless-stopped

  migrations:
    image: ghcr.io/swezakk/stocklens-ingestor:${IMAGE_TAG:-latest}
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    # Однократный запуск: завершается после применения миграций.
    mem_limit: 512m
    restart: "no"

  redis:
    image: redis:7-alpine
    # Чистый кэш без персистентности: LRU-вытеснение ограничивает рост памяти.
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 320m
    restart: unless-stopped

  ingestor:
    image: ghcr.io/swezakk/stocklens-ingestor:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TICKERS_UNIVERSE: ${TICKERS_UNIVERSE:-IMOEX}
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      # Heartbeat-файл обновляется сборщиком каждые ~60 с;
      # файл старше 5 минут — признак зависшего процесса.
      test:
        [
          "CMD-SHELL",
          "test -f /tmp/ingestor-heartbeat && find /tmp/ingestor-heartbeat -mmin -5 | grep -q .",
        ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
    mem_limit: 1g
    restart: unless-stopped

  mlflow-db-init:
    # Идемпотентно создаёт БД mlflow на заполненном external-томе (initdb.d там не сработает —
    # выполняется лишь при первой инициализации пустого тома). $$ экранирует подстановку compose.
    image: postgres:16-alpine
    entrypoint: ["sh", "-c"]
    command:
      - >
        psql "$$DATABASE_ADMIN_URL" -tc "SELECT 1 FROM pg_database WHERE datname='mlflow'"
        | grep -q 1 || psql "$$DATABASE_ADMIN_URL" -c "CREATE DATABASE mlflow"
    environment:
      DATABASE_ADMIN_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/postgres
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 256m
    restart: "no"

  mlflow:
    # 7-й сервис (инвариант §4): tracking + реестр. Образ собран в CI (psycopg добавлен поверх
    # официального mlflow). Наружу не публикуется — API ходит на http://mlflow:5000 внутри сети.
    image: ghcr.io/swezakk/stocklens-mlflow:${IMAGE_TAG:-latest}
    command: >
      mlflow server
      --backend-store-uri postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@db:5432/mlflow
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
      --host 0.0.0.0 --port 5000
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    depends_on:
      db:
        condition: service_healthy
      mlflow-db-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    expose:
      - "5000"
    mem_limit: 768m
    restart: unless-stopped

  api:
    image: ghcr.io/swezakk/stocklens-api:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL_ASYNC: ${DATABASE_URL_ASYNC}
      REDIS_URL: ${REDIS_URL}
      # Авторизация. AUTH_SECRET и AUTH_OWNER_PASSWORD — из env-стора Dokploy (обязательны).
      # Все параметры вынесены наружу: переход на Keycloak = смена env, без правки compose.
      AUTH_MODE: ${AUTH_MODE:-local}
      AUTH_ISSUER: ${AUTH_ISSUER:-https://stocklens.local}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-stocklens-api}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-}
      AUTH_OWNER_USERNAME: ${AUTH_OWNER_USERNAME:-admin}
      AUTH_OWNER_PASSWORD: ${AUTH_OWNER_PASSWORD}
      AUTH_TOKEN_TTL_SECONDS: ${AUTH_TOKEN_TTL_SECONDS:-3600}
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Только внутренний порт: наружу API выводит Traefik (Dokploy), см. docs/deploy.md.
    expose:
      - "8000"
    mem_limit: 1g
    restart: unless-stopped

  dashboard:
    image: ghcr.io/swezakk/stocklens-dashboard:${IMAGE_TAG:-latest}
    environment:
      # Дашборд ходит только в API по HTTP (§3); пароль владельца вводится на гейте
      # (= логин в API), секретов в env дашборда нет — только адрес API и имя пользователя.
      API_URL: ${API_URL:-http://api:8000}
      AUTH_OWNER_USERNAME: ${AUTH_OWNER_USERNAME:-admin}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Только внутренний порт: наружу дашборд выводит Traefik (Dokploy) на домен.
    expose:
      - "8501"
    mem_limit: 512m
    restart: unless-stopped

  bot:
    image: ghcr.io/swezakk/stocklens-bot:${IMAGE_TAG:-latest}
    # DNS этого VPS отравлен для Telegram: api.telegram.org резолвится в недостижимый отсюда
    # DC 149.154.166.110 (connection timeout), тогда как канонический IP 149.154.167.220
    # достижим (проверено getMe end-to-end). Пиннинг через /etc/hosts: aiohttp использует
    # ThreadedResolver (aiodns в стеке нет), который читает /etc/hosts. Если Telegram сменит
    # IP — обновить здесь; нездоровье сразу видно (heartbeat пишется только после get_me).
    extra_hosts:
      - "api.telegram.org:149.154.167.220"
    environment:
      # Бот — потребитель API по HTTP (§3); токен бота и пароль владельца — из env-стора Dokploy.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      API_URL: ${API_URL:-http://api:8000}
      AUTH_OWNER_USERNAME: ${AUTH_OWNER_USERNAME:-admin}
      AUTH_OWNER_PASSWORD: ${AUTH_OWNER_PASSWORD}
      # Чат владельца для планового дайджеста 08:30 МСК (B3); алерты идут в chat_id подписки.
      DIGEST_CHAT_ID: ${DIGEST_CHAT_ID}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Heartbeat-файл обновляется ботом каждые ~30 с; файл старше 5 минут — зависший polling.
      test:
        [
          "CMD-SHELL",
          "test -f /tmp/bot-heartbeat && find /tmp/bot-heartbeat -mmin -5 | grep -q .",
        ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    # Бот ходит наружу к Telegram (long-polling) и внутрь к API; входящих портов нет.
    mem_limit: 384m
    restart: unless-stopped

volumes:
  # Внешний том создаётся вручную (docker volume create stocklens_pgdata) до первого деплоя.
  # external: true гарантирует, что Dokploy/`docker compose down -v` его не удалит.
  pgdata:
    external: true
    name: stocklens_pgdata
  # Артефакты моделей MLflow — тоже external, чтобы пересборка/redeploy их не теряли
  # (docker volume create stocklens_mlflow_artifacts до первого деплоя).
  mlflow_artifacts:
    external: true
    name: stocklens_mlflow_artifacts
