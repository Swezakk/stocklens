# Локальная разработка. Стек наращивается по фазам спеки (§4: 7 сервисов);
# прод-оверрайд для VPS (Dokploy) — docker-compose.prod.yml, появится в фазе деплоя.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Только loopback: для локальных миграций и psql с хоста,
      # наружу PostgreSQL не публикуется.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  migrations:
    build:
      context: .
      dockerfile: services/ingestor/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    # Однократный запуск: завершается после применения миграций.
    restart: "no"

  ingestor:
    build:
      context: .
      dockerfile: services/ingestor/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TICKERS_UNIVERSE: ${TICKERS_UNIVERSE:-IMOEX}
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      # Heartbeat-файл обновляется сборщиком каждые ~60 с;
      # файл старше 5 минут — признак зависшего процесса.
      test:
        [
          "CMD-SHELL",
          "test -f /tmp/ingestor-heartbeat && find /tmp/ingestor-heartbeat -mmin -5 | grep -q .",
        ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
    restart: unless-stopped

volumes:
  pgdata:
