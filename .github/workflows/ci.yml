name: CI

on:
  push:
    branches: [main]
  pull_request:

# Конвейер расширяется вместе с кодом: сборка Docker-образов
# добавляется с первым сервисом.
jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: ruff check
        run: uvx ruff check .

      - name: ruff format check
        run: uvx ruff format --check .

  core:
    name: stocklens-core (pytest + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: uv sync
        run: uv sync --project packages/stocklens-core

      - name: pytest (coverage >= 50%)
        run: >
          uv run --project packages/stocklens-core
          pytest packages/stocklens-core/tests
          --cov=stocklens_core --cov-fail-under=50

      - name: mypy strict
        run: >
          uv run --project packages/stocklens-core
          mypy packages/stocklens-core/src packages/stocklens-core/tests

  migrations:
    name: migrations (alembic + testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: uv sync
        run: uv sync

      - name: pytest integration (PostgreSQL 16 в testcontainers)
        run: uv run pytest tests -m integration

      - name: mypy strict
        run: uv run mypy alembic tests

  ingestor:
    name: ingestor (pytest + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: uv sync
        run: uv sync --project services/ingestor

      - name: pytest (coverage >= 50%, integration в testcontainers)
        run: >
          uv run --project services/ingestor
          pytest services/ingestor/tests
          --cov=ingestor --cov-fail-under=50

      - name: mypy strict
        run: >
          uv run --project services/ingestor
          mypy services/ingestor/src services/ingestor/tests

  api:
    name: api (pytest + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: uv sync
        run: uv sync --project services/api

      - name: pytest (coverage >= 50%, integration в testcontainers)
        run: >
          uv run --project services/api
          pytest services/api/tests
          --cov=api --cov-fail-under=50

      - name: mypy strict
        run: >
          uv run --project services/api
          mypy services/api/src services/api/tests

  build:
    name: docker compose build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: env для compose-интерполяции
        run: cp .env.example .env

      - name: docker compose build
        run: docker compose build

  publish:
    name: publish images (GHCR)
    runs-on: ubuntu-latest
    # Публикуем только зелёный main: образы тянет прод-сервер (Dokploy), сборка — здесь.
    needs: [lint, core, migrations, ingestor, api]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: ghcr.io/swezakk/stocklens-api
            dockerfile: services/api/Dockerfile
          - image: ghcr.io/swezakk/stocklens-ingestor
            dockerfile: services/ingestor/Dockerfile
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GHA-кэш ускоряет повторные сборки (особенно ONNX-экспорт в ingestor).
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
