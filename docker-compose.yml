# Локальная разработка. Стек наращивается по фазам спеки (§4: 7 сервисов);
# прод-оверрайд для VPS (Dokploy) — docker-compose.prod.yml, появится в фазе деплоя.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Только loopback: для локальных миграций и psql с хоста,
      # наружу PostgreSQL не публикуется.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
