# Корневой проект: Alembic-миграции (модели из stocklens-core) и общий конфиг
# инструментов качества. Зависимости сервисов живут в их pyproject.toml (uv),
# workspace не используется — у каждого компонента свой uv.lock.

[project]
name = "stocklens"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4,<2",
    "psycopg[binary]>=3.3",
    "stocklens-core",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-cov>=6",
    "mypy>=2.1",
    "testcontainers[postgres]>=4.14",
]

[tool.uv]
package = false

[tool.uv.sources]
stocklens-core = { path = "packages/stocklens-core", editable = true }

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages", "services", "ml"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "PL",  # pylint
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific
    "N",   # pep8-naming
    "DTZ", # flake8-datetimez — наивные datetime запрещены
    "T20", # flake8-print — print в коде сервисов запрещён (structlog)
]
ignore = [
    "PLR0913", # max-args: DI-провайдеры FastAPI легитимно принимают много зависимостей
    "RUF001",  # «неоднозначный юникод»: документация проекта на русском — кириллица легитимна
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["PLR2004"] # magic numbers допустимы в assert'ах тестов
"ml/notebooks/**" = ["T20"] # print допустим в ноутбуках

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
# Нетипизированные сторонние границы (нет py.typed/стабов): testcontainers —
# интеграционные тесты; apscheduler 3.x — планировщик; feedparser (стабы
# types-feedparser неполные), onnxruntime/tokenizers/optimum — sentiment-инференс.
module = [
    "testcontainers.*",
    "apscheduler.*",
    "feedparser",
    "feedparser.*",
    "onnxruntime",
    "onnxruntime.*",
    "tokenizers",
    "tokenizers.*",
    "optimum",
    "optimum.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages", "services", "tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: тесты с реальными зависимостями (testcontainers)",
]
