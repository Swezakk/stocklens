# Локальная разработка. Стек наращивается по фазам спеки (§4: 7 сервисов);
# прод-оверрайд для VPS (Dokploy) — docker-compose.prod.yml, появится в фазе деплоя.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Только loopback: для локальных миграций и psql с хоста,
      # наружу PostgreSQL не публикуется.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  migrations:
    build:
      context: .
      dockerfile: services/ingestor/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    # Однократный запуск: завершается после применения миграций.
    restart: "no"

  redis:
    image: redis:7-alpine
    # Чистый кэш без персистентности: LRU-вытеснение не даёт памяти расти
    # неограниченно при множестве ключей свечей (разные тикеры и диапазоны дат).
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL_ASYNC: ${DATABASE_URL_ASYNC}
      REDIS_URL: ${REDIS_URL}
      AUTH_MODE: ${AUTH_MODE:-local}
      AUTH_ISSUER: ${AUTH_ISSUER:-https://stocklens.local}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-stocklens-api}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-}
      AUTH_OWNER_USERNAME: ${AUTH_OWNER_USERNAME:-admin}
      AUTH_OWNER_PASSWORD: ${AUTH_OWNER_PASSWORD}
      AUTH_TOKEN_TTL_SECONDS: ${AUTH_TOKEN_TTL_SECONDS:-3600}
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  ingestor:
    build:
      context: .
      dockerfile: services/ingestor/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TICKERS_UNIVERSE: ${TICKERS_UNIVERSE:-IMOEX}
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      # Heartbeat-файл обновляется сборщиком каждые ~60 с;
      # файл старше 5 минут — признак зависшего процесса.
      test:
        [
          "CMD-SHELL",
          "test -f /tmp/ingestor-heartbeat && find /tmp/ingestor-heartbeat -mmin -5 | grep -q .",
        ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
    restart: unless-stopped

volumes:
  pgdata:
